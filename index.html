<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almoxarifado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#17202a;--mut:#5d6b7a;--pri:#0b5cab;--ok:#1e8e3e;--warn:#c77700;--bd:#d9e1ea}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--tx:#e8eef5;--mut:#93a1b0;--pri:#4a9bf0;--bd:#2a3644}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--mut);font-size:15px;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:200px}
button.b{padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;color:#fff;background:var(--pri);width:100%}
button.b.ok{background:var(--ok)}button.b.warn{background:var(--warn)}button.b.gr{background:var(--mut)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.hide{display:none}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.tag.e{background:var(--pri)}.tag.d{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--bd);padding:6px;text-align:left}th{background:var(--bg)}
.wrap{overflow-x:auto}
#top{display:flex;background:var(--card);border-bottom:2px solid var(--bd)}
#top button{flex:1;padding:14px 6px;border:0;background:none;color:var(--mut);font-size:16px;font-weight:700;border-bottom:4px solid transparent}
#top button.on{color:var(--pri);border-color:var(--pri)}
.opt{flex:1;padding:12px 6px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-weight:700;font-size:15px}
.opt.sel{background:var(--pri);border-color:var(--pri);color:#fff}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<header><h1>📦 Almoxarifado</h1><span id="cnt">0 itens</span></header>
<div id="top" class="noprint"><button id="m1" class="on" onclick="mod(1)">📋 Inventário</button><button id="m2" onclick="mod(2)">🚚 Requisições</button></div>
<div id="mInv">
<nav class="noprint"><button id="t1" class="on" onclick="tab(1)">Ler</button><button id="t2" onclick="tab(2)">Lista</button><button id="t3" onclick="tab(3)">Relatório</button></nav>
<main>
<section id="v1">
  <div class="card" id="scanCard">
    <div id="reader"></div>
    <div id="st" style="text-align:center;font-weight:700;color:var(--pri);min-height:22px;margin-top:6px"></div>
    <div class="row noprint"><button class="b" id="camBtn" onclick="startCam()">Ligar câmera</button><button class="b gr" onclick="manual()">Digitar código</button></div>
    <p style="color:var(--mut);font-size:13px;margin:8px 0 0">Aponte para o código (QR ou barras) da plaquinha.</p>
  </div>
  <div class="card hide" id="step">
    <label>Código</label><input id="code" oninput="codeIn()">
    <div id="warn" style="color:var(--warn);font-size:13px;font-weight:700;margin-top:4px"></div>
    <label>Nome da peça</label><input id="name" placeholder="Nome na plaquinha" oninput="saveDraft()">
    <label>Referência (faixa preta da plaquinha)</label><input id="ref" oninput="saveDraft()">
    <div class="row"><button class="b gr" id="ocrBtn" onclick="ocr()">📷 Ler texto da plaquinha</button></div>
    <div id="q">
      <p style="font-weight:700;margin:16px 0 4px">É estoque ou aplicação direta?</p>
      <div class="row"><button class="b" onclick="choose('E')">Estoque</button><button class="b warn" onclick="choose('D')">Aplicação direta</button></div>
    </div>
    <div id="qty" class="hide">
      <label>Quantidade em estoque físico <b id="un"></b></label><input id="qtd" type="number" inputmode="decimal" min="0">
      <div class="row"><button class="b gr" onclick="back()">Voltar</button><button class="b ok" onclick="save('E')">Salvar</button></div>
    </div>
    <button class="b gr" style="margin-top:8px" onclick="cancel()">Cancelar</button>
  </div>
  <div class="card" id="recent"></div>
</section>
<section id="v2" class="hide"><div class="card" id="list"></div></section>
<section id="v3" class="hide">
  <div class="card" id="rep"></div>
  <div class="row noprint"><button class="b" onclick="print()">Imprimir / PDF</button><button class="b ok" onclick="csv()">Baixar CSV</button></div>
  <div class="row noprint"><button class="b gr" onclick="clearAll()">Limpar contagem</button></div>
</section>
</main>
</div>
<div id="mReq" class="hide"><main>
  <div class="card"><b>1. Coligada</b>
    <div class="row" id="colBtns"><button class="opt" onclick="setCol('Amafil')">Amafil</button><button class="opt" onclick="setCol('Derimam')">Derimam</button><button class="opt" onclick="setCol('Jopllam')">Jopllam</button></div>
    <label>CNPJ</label><input id="rcnpj" inputmode="numeric" placeholder="Selecione a coligada" oninput="cnpjIn()">
  </div>
  <div class="card"><b>2. Produtos</b>
    <div id="rreader" style="width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:160px;margin-top:8px"></div>
    <div id="rst" style="text-align:center;font-weight:700;color:var(--pri);min-height:22px;margin-top:6px"></div>
    <div class="row"><button class="b" id="rcamBtn" onclick="startRcam()">Ligar câmera</button></div>
    <label>Código</label><input id="rcode" inputmode="numeric" oninput="rcodeIn()">
    <div id="rwarn" style="color:var(--warn);font-size:13px;font-weight:700;margin-top:4px"></div>
    <label>Descrição</label><input id="rname">
    <div class="row"><div><label>Quantidade <b id="run"></b></label><input id="rqtd" inputmode="decimal"></div><div><label>Valor unitário (R$)</label><input id="rval" inputmode="decimal"></div></div>
    <div class="row" style="margin-top:12px"><button class="b gr" onclick="clearForm()">Limpar</button><button class="b ok" onclick="addItem()">+ Adicionar item</button></div>
    <div id="ritems" style="margin-top:12px"></div>
  </div>
  <div class="card"><b>3. Transporte</b>
    <label>Transportadora</label>
    <div class="row" id="trBtns"><button class="opt" onclick="setTr('Amafil')">Amafil</button><button class="opt" onclick="setTr('Lifama')">Lifama</button></div>
    <label>Placa</label><input id="rplaca" maxlength="8" placeholder="ABC1D23" oninput="placaIn(this)">
  </div>
  <div class="row"><button class="b" onclick="pdfSave()">📄 Gerar PDF</button><button class="b ok" onclick="pdfShare()">📤 Compartilhar</button></div>
  <div class="row"><button class="b gr" onclick="newReq()">Nova requisição</button></div>
</main></div>

<script>
const $=id=>document.getElementById(id);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tab(n){[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!=n);$('t'+i).classList.toggle('on',i==n)});if(n==2)renderList();if(n==3)renderRep()}
async function startCam(){
  if(cam)return;
  try{
    cam=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    await cam.start({facingMode:'environment'},{fps:15,
      qrbox:(w,h)=>({width:Math.floor(w*0.9),height:Math.floor(Math.min(h*0.6,w*0.5))}),

}
let seen='',hits=0,since=0,lastAt=0,cool=0;
function onScan(text){
  if(paused||Date.now()<cool)return;
  const tt=text.trim(),now=Date.now();
  if(tt===seen&&now-lastAt<1500)hits++;else{seen=tt;hits=1;since=now}
  lastAt=now;
  $('st').textContent='Confirmando leitura...';
  if(hits<4||now-since<900)return;
  seen='';hits=0;$('st').textContent='';paused=true;
  if(navigator.vibrate)navigator.vibrate(100);
  let c=text.trim(),n='';
  const parts=c.split(/[\n;|]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>1){c=parts[0];n=parts.slice(1).join(' ')}
  const fr=grab();openStep(c,n);if(fr&&!BASE[c])runOcr(fr,false);
}
function manual(){paused=true;openStep('','')}
function openStep(c,n){
  const ex=data.findIndex(d=>d.code===c);editIdx=ex;
  const b=BASE[c];$('code').value=c;$('name').value=b?b[0]:(n||(ex>=0?data[ex].name:''));$('un').textContent=b?b[1]:'';$('ref').value=ex>=0?(data[ex].ref||''):'';$('warn').textContent=(c&&!b)?'⚠️ Código não encontrado na planilha.':'';
  $('step').classList.remove('hide');$('q').classList.remove('hide');$('qty').classList.add('hide');
  if(ex>=0)alert('Este código já está na lista. Salvar vai substituir o registro anterior.');

}

function save(t){
  const code=$('code').value.trim(),name=$('name').value.trim();
  let qtd='';
  if(t==='E'){qtd=$('qtd').value;if(qtd===''){alert('Informe a quantidade.');return}}
  const rec={code,name,un:(BASE[code]||[])[1]||'',ref:$('ref').value.trim(),tipo:t,qtd,hora:new Date().toLocaleString('pt-BR')};
  const i=data.findIndex(d=>d.code===code);

}

function renderRecent(){

function grab(){
  const v=document.querySelector('#reader video');
  if(!v||!v.videoWidth)return null;
  const k=Math.min(1,1280/v.videoWidth),cv=document.createElement('canvas');
  cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);
  cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);return cv;
}
function ocr(){const f=grab();if(!f){alert('Ligue a câmera primeiro.');return}runOcr(f,true)}
let wk=null;
async function runOcr(cv,force){
  const b=$('ocrBtn');b.textContent='Lendo texto...';b.disabled=true;
  try{
    if(!wk)wk=await Tesseract.createWorker('por');
    const t1=(await wk.recognize(cv)).data.text;
    const iv=document.createElement('canvas');iv.width=cv.width;iv.height=cv.height;
    const x=iv.getContext('2d');x.drawImage(cv,0,0);
    const im=x.getImageData(0,0,iv.width,iv.height),dd=im.data;
    for(let i=0;i<dd.length;i+=4){const g=255-(dd[i]*.3+dd[i+1]*.59+dd[i+2]*.11);dd[i]=dd[i+1]=dd[i+2]=g}
    x.putImageData(im,0,0);
    const t2=(await wk.recognize(iv)).data.text;
    const re=/([A-Za-zÀ-ú]{2,})\s*[-–—_~]\s*(\d{5,})\s*[-–—_~]\s*(\d{1,4})/;
    let ref='',cod='';
    for(const l of (t1+'\n'+t2).split('\n')){const m=l.trim().match(re);if(m){ref=m[1]+' - '+m[2]+' - '+m[3];cod=m[2];break}}
    let name='',best=0;
    for(const l of t1.split('\n').map(s=>s.trim())){
      const nl=(l.match(/[A-Za-zÀ-ú]/g)||[]).length,nn=l.replace(/\s/g,'').length,up=(l.match(/[A-ZÀ-Ú]/g)||[]).length;
      if(nl>=5&&nl/nn>=.85&&up/nl>=.8&&!re.test(l)&&nl>best){best=nl;name=l}
    }
    if(ref&&(force||!$('ref').value))$('ref').value=ref;
    if(cod&&!$('code').value.trim())$('code').value=cod;
    if(name&&(force||!$('name').value.trim()))$('name').value=name;
    const cc=$('code').value.trim();
    $('warn').textContent=(cod&&cc&&cod!==cc)?'⚠️ A faixa preta indica '+cod+', mas o código lido foi '+cc+'. Confira.':'';
    saveDraft();
    if(force&&!name&&!ref)alert('Não consegui ler o texto. Chegue mais perto, melhore a luz ou digite.');
  }catch(e){if(force)alert('Erro ao ler o texto. Digite manualmente.')}
  b.textContent='📷 Ler texto da plaquinha';b.disabled=false;
}
function renderList(){
  $('list').innerHTML=data.length?[...data].reverse().map(d=>{const i=data.indexOf(d);return `<div class="item"><div><b>${esc(d.code)}</b><br>${esc(d.name)||'<i>sem nome</i>'}<br>${d.ref?'<small>'+esc(d.ref)+'</small><br>':''}<span class="tag ${d.tipo=='E'?'e':'d'}">${d.tipo=='E'?'Estoque: '+esc(d.qtd)+' '+esc(d.un||''):'Aplicação direta'}</span></div><button onclick="del(${i})" style="border:0;background:none;font-size:20px">🗑️</button></div>`}).join(''):'Nenhum item lido ainda.';
}
function del(i){if(confirm('Remover este item?')){data.splice(i,1);persist();renderList()}}

}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const t='\ufeff'+['Código;Nome;Referência;Tipo;Quantidade;Unidade;Hora',...data.map(x=>[q(x.code),q(x.name),q(x.ref||''),x.tipo=='E'?'Estoque':'Aplicação direta',x.tipo=='E'?x.qtd:'',x.un||'',q(x.hora)].join(';'))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='contagem-estoque.csv';a.click();
}

  d.setFontSize(10);d.setFont('helvetica','normal');y+=6;
  d.text('Solicitação de nota fiscal de venda para coligada',M,y);
  y+=4;d.line(M,y,RE,y);y+=7;
  [['Data/hora',new Date().toLocaleString('pt-BR')],['Coligada (destinatário)',R.col],['CNPJ',R.cnpj],['Transportadora',R.transp],['Placa',R.placa]].forEach(([k,v])=>{
    d.setFont('helvetica','bold');d.text(k+':',M,y);d.setFont('helvetica','normal');d.text(lat(v),M+48,y);y+=6;
  });
  y+=3;
  const head=()=>{d.setFillColor(225,230,236);d.rect(M,y-4.5,RE-M,7,'F');d.setFont('helvetica','bold');d.setFontSize(9);
    d.text('#',M+1,y);d.text('Código',M+8,y);d.text('Descrição',M+30,y);d.text('Un',112,y);d.text('Qtd',142,y,{align:'right'});d.text('Vl. unit.',168,y,{align:'right'});d.text('Total',RE-1,y,{align:'right'});y+=7;d.setFont('helvetica','normal')};
  head();
  let tot=0;
  R.items.forEach((x,i)=>{
    const ln=d.splitTextToSize(lat(x.name),64),h=Math.max(6,ln.length*4.4+2);
    if(y+h>278){d.addPage();y=18;head()}
    const t=x.q*x.v;tot+=t;
    d.text(String(i+1),M+1,y);d.text(lat(x.code),M+8,y);d.text(ln,M+30,y);d.text(lat(x.un),112,y);
    d.text(x.q.toLocaleString('pt-BR'),142,y,{align:'right'});d.text(brl(x.v),168,y,{align:'right'});d.text(brl(t),RE-1,y,{align:'right'});
    y+=h-1;d.setDrawColor(210);d.line(M,y-3.2,RE,y-3.2);d.setDrawColor(0);
  });
  y+=3;if(y>255){d.addPage();y=18}
  d.setFont('helvetica','bold');d.setFontSize(11);d.text('TOTAL GERAL: '+brl(tot),RE-1,y,{align:'right'});
  y+=22;d.setFont('helvetica','normal');d.setFontSize(10);
  d.line(M,y,M+80,y);d.line(M+100,y,RE,y);y+=5;d.text('Solicitante',M,y);d.text('Data',M+100,y);
  const np=d.getNumberOfPages();
  for(let i=1;i<=np;i++){d.setPage(i);d.setFontSize(8);d.text('Página '+i+'/'+np,RE,290,{align:'right'})}
  return {d,name:`requisicao-${R.col.toLowerCase()}-${new Date().toISOString().slice(0,10)}.pdf`};
}
function pdfSave(){const r=mkPdf();if(r)r.d.save(r.name)}
function pdfShare(){
  const r=mkPdf();if(!r)return;
  const f=new File([r.d.output('blob')],r.name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Requisição '+R.col}).catch(()=>{});
  else r.d.save(r.name);
}

persist();restoreDraft();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if(localStorage.getItem('modulo')==='2')mod(2)}catch(e){}
</script>
